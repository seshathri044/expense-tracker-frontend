name: expense_tracker
description: A beautiful expense tracker application with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP Requests
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.3

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Date & Time
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.69.0

  # Icons
  font_awesome_flutter: ^10.7.0
  
  # File System (Required for path_provider)
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true